[workspace]
members = ["crates/nibcase-libretro", "crates/nibcase", "crates/nibcase-test"]
exclude = ["tools/bindings"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/abradburne/nibcase"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
